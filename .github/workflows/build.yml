name: Build plugins

on:
  push:
    branches: [main]
    paths:
      - "releases/*.zip"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "types/**"
      - "package.json"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Diagnostyka 2026-11-03: runnery GitHub padaly w tym repo zawsze
      # w punkcie bookView.test.js (5/5 prob, solo-run tez). Połowienie:
      # 3 grupy testow w osobnych procesach; krok, ktory zabije agenta,
      # wskazuje grupe winowajcy. Kolejnosc testow w grupach zachowana
      # (stan modulowy wspoldzielony w procesie).
      - name: Diag bookView G1 (render)
        run: npx tsc -p tsconfig.test.json && node --test --test-name-pattern='trzy sub-pigulki|widok pokazuje liste|aliasy pocztowe|bez aliasow' out-test/tests/bookView.test.js

      - name: Diag bookView G2 (dodaj/usun pojedyncze)
        run: node --test --test-name-pattern='krzyzyk usuwa|dodanie imienia|walidacja' out-test/tests/bookView.test.js

      - name: Diag bookView G3 (zaznaczanie i refresh)
        run: node --test --test-name-pattern='usuwanie zaznaczonych|zaznaczenie znika' out-test/tests/bookView.test.js

      - name: Tests
        timeout-minutes: 30
        run: npm test -- --test-timeout=120000

      - name: Build plugins
        run: node scripts/build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
